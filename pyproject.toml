[project]
name = "pcg-llm"
version = "0.1.0"
description = "Predictive Coding Graph Language Model — a non-hierarchical, dynamically routed neural architecture using Inference Learning and DEQ solving"
readme = "README.md"
requires-python = ">=3.12"  # 3.13 is the dev/CI standard; 3.12 minimum for Kaggle runtime
license = {text = "MIT"}
authors = [
    {name = "pcg-llm contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.5.0",
    "einops>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "bandit[toml]>=1.7.5",
]
deq = [
    "torchdeq>=0.1.0",
]
triton = [
    "triton>=3.0.0",
]
training = [
    "bitsandbytes>=0.43.0",
    "datasets>=2.19.0",
    "transformers>=4.40.0",
    "wandb>=0.17.0",
]
eval = [
    "lm-eval>=0.4.0",
]
gcp = [
    "google-cloud-storage>=2.16.0",
    "tenacity>=8.2.0",
]
all = [
    "triton>=3.0.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.19.0",
    "transformers>=4.40.0",
    "wandb>=0.17.0",
    "lm-eval>=0.4.0",
    "google-cloud-storage>=2.16.0",
    "tenacity>=8.2.0",
]

[project.urls]
Homepage = "https://github.com/your-username/pcg-llm"
Repository = "https://github.com/your-username/pcg-llm"
Issues = "https://github.com/your-username/pcg-llm/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ============================================================================
# Ruff Configuration
# ============================================================================
[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4
extend-exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "ISC001", # Conflicts with formatter
    "N803",   # Argument name should be lowercase (ML convention: Z, W, B etc.)
    "N806",   # Variable in function should be lowercase (ML convention: Z, W, B etc.)
    "N812",   # Lowercase imported as non-lowercase (F = functional is standard)
    "EM",     # Exception message rules (too noisy for this codebase)
    "SIM105", # Use contextlib.suppress (minor style)
    "SIM108", # Use ternary operator (readability preference)
    "N801",   # Class name CapWords (nGPTNorm is intentional ML naming)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",    # Unused arguments OK in tests
    "S101",   # Assert statements allowed in tests
    "F841",   # Unused variables common in test setup
    "B007",   # Loop variable not used in body (use _ by convention)
    "E741",   # Ambiguous variable name (l, etc.)
    "SIM117", # Nested with statements
    "PT011",  # pytest.raises too broad
    "C408",   # dict() vs {} literal
    "PTH123", # open() in tests
]
"benchmarks/**/*.py" = [
    "PTH123", # open() in benchmarks
    "T201",   # print() allowed in benchmarks
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# MyPy Configuration
# ============================================================================
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# PyTorch and related packages lack full stubs
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchdeq.*",
    "triton.*",
    "einops.*",
    "bitsandbytes.*",
    "datasets.*",
    "transformers.*",
    "wandb.*",
    "lm_eval.*",
    "google.cloud.*",
    "google.api_core.*",
    "tenacity.*",
    "numpy.*",
]
ignore_missing_imports = true

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=src/pcg_llm",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
    "-ra",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require a GPU",
    "convergence: marks tests that verify DEQ convergence properties",
]

[tool.coverage.run]
branch = true
source = ["src/pcg_llm"]
omit = [
    "tests/*",
    "*/__init__.py",
    "src/pcg_llm/data/tokenizer.py",
    "src/pcg_llm/evaluation/harness.py",
    "src/pcg_llm/checkpointing/gcs.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.paths]
source = [
    "src/",
    "*/site-packages/",
]

# ============================================================================
# Bandit Security Configuration
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert statements OK in non-test code for invariant checks
